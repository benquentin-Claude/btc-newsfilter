name: newsfilter

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (privates Repo: passt in die 2.000 Freiminuten; GitHub startet oft einige Minuten später)
  workflow_dispatch:          # manuell starten über den Actions-Tab
    inputs:
      test_ai:
        description: "Nur die KI-Bewertung testen (5 neueste Meldungen, nichts senden)"
        type: boolean
        default: false

concurrency:
  group: newsfilter
  cancel-in-progress: false

permissions:
  contents: write             # state.json zurückschreiben

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python newsfilter.py ${{ inputs.test_ai && '--test-ai' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Zustand speichern
        if: ${{ !inputs.test_ai }}
        run: |
          if ! git diff --quiet state.json 2>/dev/null || [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "newsfilter-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
