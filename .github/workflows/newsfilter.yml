name: newsfilter

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet geplante Läufe oft einige Minuten später)
  workflow_dispatch:          # manuell starten über den Actions-Tab

concurrency:
  group: newsfilter
  cancel-in-progress: false

permissions:
  contents: write             # state.json zurückschreiben

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python newsfilter.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: Zustand speichern
        run: |
          if ! git diff --quiet state.json 2>/dev/null || [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "newsfilter-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
